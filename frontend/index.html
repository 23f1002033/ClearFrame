<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearFrame — Production Script Clearance &amp; Legal Triage</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN with Studio Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          },
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom ClearFrame Stylesheet -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="h-full flex flex-col select-none">
  <!-- Application Shell Mounts -->
  <header id="appHeader" class="flex-shrink-0"></header>
  
  <main id="appMain" class="flex-1 relative overflow-hidden"></main>
  
  <div id="appModals"></div>

  <!-- Main ES Module Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
